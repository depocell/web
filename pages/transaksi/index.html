<!-- TOP BAR: BRAND SWITCHER & EXPORT -->
<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 18px;">
  <div>
    <h2 id="piv-main-title" style="font-size: 20px; font-weight: 700; letter-spacing: -0.4px;">Pivot Transaksi Digital</h2>
    <p id="piv-main-desc" style="font-size: 13.5px; color: var(--text-muted); margin-top: 2px;">
      Analisis multidimensi fleksibel transaksi berdasarkan Kategori Produk, Operator, Paket, dan Suplier
    </p>
  </div>

  <div style="display: flex; align-items: center; gap: 10px;">
    <!-- Brand Toggle Switcher (Unified Capsule) -->
    <div class="unified-brand-switcher">
      <button type="button" id="btn-piv-astaga" class="unified-brand-btn active" data-brand="ASTAGA" onclick="switchPivotBrand('ASTAGA')">
        <span class="brand-dot"></span>
        ASTAGA
      </button>
      <button type="button" id="btn-piv-oki" class="unified-brand-btn" data-brand="OKIPAY" onclick="switchPivotBrand('OKIPAY')">
        <span class="brand-dot"></span>
        OKIPAY
      </button>
    </div>

    <!-- Export Button -->
    <button type="button" onclick="exportPivotExcel()" style="padding: 7px 14px; border-radius: 8px; border: 1px solid var(--surface-border); background: var(--surface); color: var(--text-main); font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 7px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="8" y1="13" x2="16" y2="13"></line>
        <line x1="8" y1="17" x2="16" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      Export Excel
    </button>
  </div>
</div>

<!-- PIVOT CONTROL PANEL -->
<div class="card" style="padding: 18px 20px; margin-bottom: 20px;">
  <!-- ROW 1: DIMENSIONS & METRIC -->
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 14px;">
    <!-- Dimensi Baris -->
    <div>
      <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
        1. Baris (Row Dimension)
      </label>
      <select id="piv-row-dim" onchange="runPivot()" class="piv-select">
        <!-- Terisi dinamis sesuai sub page -->
      </select>
    </div>

    <!-- Dimensi Kolom -->
    <div>
      <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
        2. Kolom (Column Dimension)
      </label>
      <select id="piv-col-dim" onchange="runPivot()" class="piv-select">
        <!-- Terisi dinamis sesuai sub page -->
      </select>
    </div>

    <!-- Metrik / Nilai -->
    <div>
      <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
        3. Nilai / Metrik (Value)
      </label>
      <select id="piv-metric" onchange="runPivot()" class="piv-select">
        <option value="trx_count">Jumlah Transaksi (Count)</option>
        <option value="daily_trx">Daily Trx (Rata-rata Trx / Hari)</option>
        <option value="sukses_pct">Success Rate (% Sukses)</option>
      </select>
    </div>

    <!-- Filter Tahun -->
    <div>
      <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
        Tahun
      </label>
      <select id="piv-filter-year" onchange="onPivotYearChange()" class="piv-select">
        <option value="2026" selected>2026</option>
        <option value="2025">2025</option>
      </select>
    </div>

    <!-- Filter Bulan -->
    <div>
      <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
        Filter Periode Bulan
      </label>
      <select id="piv-filter-month" onchange="runPivot()" class="piv-select">
        <option value="ALL">Semua Bulan</option>
      </select>
    </div>
  </div>

  <!-- ROW 2: FILTERS & LIMIT -->
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; align-items: end; border-top: 1px dashed var(--surface-border); padding-top: 14px;">
    <!-- Filter Status -->
    <div>
      <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
        Filter Status
      </label>
      <select id="piv-filter-status" onchange="runPivot()" class="piv-select">
        <option value="ALL">Semua Status</option>
      </select>
    </div>

    <!-- Filter Cabang -->
    <div>
      <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
        Filter Cabang
      </label>
      <select id="piv-filter-cabang" onchange="runPivot()" class="piv-select">
        <option value="ALL">Semua Cabang</option>
      </select>
    </div>

    <!-- Filter Kategori -->
    <div id="piv-box-kategori">
      <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
        Filter Kategori
      </label>
      <select id="piv-filter-kategori" onchange="runPivot()" class="piv-select">
        <option value="ALL">Semua Kategori</option>
      </select>
    </div>

    <!-- Filter Operator -->
    <div id="piv-box-operator">
      <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
        Filter Operator
      </label>
      <select id="piv-filter-operator" onchange="runPivot()" class="piv-select">
        <option value="ALL">Semua Operator</option>
      </select>
    </div>

    <!-- Limit Baris -->
    <div>
      <label style="display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
        Tampilkan Baris
      </label>
      <select id="piv-limit" onchange="runPivot()" class="piv-select">
        <option value="50">Top 50 Baris</option>
        <option value="100" selected>Top 100 Baris</option>
        <option value="250">Top 250 Baris</option>
        <option value="1000">Top 1,000 Baris</option>
      </select>
    </div>

    <!-- Action Button -->
    <div style="display: flex;">
      <button type="button" onclick="runPivot()" style="width: 100%; padding: 9px 16px; border-radius: 8px; border: none; background: var(--primary); color: #ffffff; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Jalankan Pivot
      </button>
    </div>
  </div>
</div>



<!-- PIVOT TABLE RESULT CONTAINER -->
<div class="card" style="padding: 0; overflow: hidden;">
  <div style="padding: 14px 20px; border-bottom: 1px solid var(--surface-border); display: flex; justify-content: space-between; align-items: center; background: var(--surface);">
    <div style="font-size: 14px; font-weight: 700;" id="piv-table-title">Tabel Hasil Pivot</div>
    <div style="font-size: 12px; color: var(--text-muted);" id="piv-exec-time">Selesai dalam - ms</div>
  </div>

  <div class="table-container" style="max-height: 600px; overflow-y: auto;">
    <table id="piv-result-table">
      <thead id="piv-thead" style="position: sticky; top: 0; z-index: 10;">
        <tr><th>Memuat kolom...</th></tr>
      </thead>
      <tbody id="piv-tbody">
        <tr><td class="loader">Silakan klik "Jalankan Pivot" untuk menampilkan data...</td></tr>
      </tbody>
      <tfoot id="piv-tfoot">
      </tfoot>
    </table>
  </div>
</div>

<style>
  .piv-select {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--surface-border);

    font-size: 13px;
    font-weight: 500;
  }

    outline: none;
    border-color: var(--primary);
  }
  #piv-result-table td, #piv-result-table th {
    white-space: nowrap;
    padding: 10px 14px;
    font-size: 13px;
  }

    background: var(--table-total);

    border-top: 2px solid var(--surface-border);

    bottom: 0;
    z-index: 5;
  }
  .brand-btn {
    padding: 7px 14px;
    border-radius: 8px;

    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;

  }

    background: var(--surface);

    box-shadow: 0 1px 3px rgba(2, 132, 199, 0.15);
  }
