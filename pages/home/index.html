<!-- pages/home/index.html — Overview Dashboard (Unified Strip Container) -->
<style>
  .overview-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .overview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 2px;
  }

  .overview-title-group h1 {
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -0.4px;
    margin: 0;
    color: var(--text-main);
  }

  .overview-title-group p {
    font-size: 0.88rem;
    color: var(--text-muted);
    margin: 3px 0 0;
  }

  /* Section Title Bar */
  .overview-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .overview-brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 4px 10px;
    border-radius: 6px;
  }

  /* UNIFIED STRIP CONTAINER (Panjang Terpadu ala Analisa Revenue) */
  .unified-strip-container {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 12px;
    padding: 14px 20px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    align-items: center;
    gap: 0;
    box-shadow: var(--card-shadow, 0 1px 3px rgba(0, 0, 0, 0.04));
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .unified-strip-container:hover {
    box-shadow: var(--card-shadow-hover, 0 4px 12px rgba(0, 0, 0, 0.07));
  }

  .unified-strip-col {
    padding: 6px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-right: 1px solid var(--surface-border);
  }

  .unified-strip-col:first-child {
    padding-left: 6px;
  }

  .unified-strip-col:last-child {
    border-right: none;
    padding-right: 6px;
  }

  .strip-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.35px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .strip-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  .strip-val {
    font-family: var(--font-mono, 'JetBrains Mono', monospace);
    font-size: 22px;
    font-weight: 800;
    line-height: 1.15;
    margin-top: 5px;
    letter-spacing: -0.4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .strip-sub {
    font-size: 10.5px;
    color: var(--text-muted);
    margin-top: 2px;
    white-space: nowrap;
  }

  /* Color Variations */
  .color-blue {
    color: #0284c7;
  }
  .strip-dot-blue {
    background: #0284c7;
  }
  html[data-theme="dark"] .strip-val-blue {
    color: #38bdf8;
  }

  .color-green {
    color: #10b981;
  }
  .strip-dot-green {
    background: #10b981;
  }
  html[data-theme="dark"] .strip-val-green {
    color: #34d399;
  }

  .color-purple {
    color: #8b5cf6;
  }
  .strip-dot-purple {
    background: #8b5cf6;
  }
  html[data-theme="dark"] .strip-val-purple {
    color: #c084fc;
  }

  .color-orange {
    color: #f59e0b;
  }
  .strip-dot-orange {
    background: #f59e0b;
  }
  html[data-theme="dark"] .strip-val-orange {
    color: #fbbf24;
  }

  /* Responsif Tablet & Mobile */
  @media (max-width: 900px) {
    .unified-strip-container {
      grid-template-columns: repeat(2, 1fr);
      row-gap: 16px;
      padding: 16px 18px;
    }
    .unified-strip-col:nth-child(2) {
      border-right: none;
    }
    .unified-strip-col:nth-child(3) {
      padding-left: 6px;
    }
  }

  @media (max-width: 540px) {
    .unified-strip-container {
      grid-template-columns: 1fr;
      row-gap: 14px;
    }
    .unified-strip-col {
      border-right: none !important;
      border-bottom: 1px solid var(--surface-border);
      padding: 0 0 12px 0 !important;
    }
    .unified-strip-col:last-child {
      border-bottom: none !important;
      padding-bottom: 0 !important;
    }
  }
</style>

<div class="overview-container">

  <!-- TOP HEADER & BRAND SWITCHER -->
  <div class="overview-header">
    <div class="overview-title-group">
      <h1>Executive Overview</h1>
      <p id="overview-subtitle">Ringkasan Analisa Distribusi Transaksi • Bulan Berjalan</p>
    </div>

    <!-- Unified Brand Switcher -->
    <div class="unified-brand-switcher" id="overview-brand-switcher">
      <button type="button" id="btn-ov-astaga" class="unified-brand-btn active" data-brand="ASTAGA" onclick="switchOverviewBrand('ASTAGA')">
        <span class="brand-dot"></span>
        ASTAGA
      </button>
      <button type="button" id="btn-ov-okipay" class="unified-brand-btn" data-brand="OKIPAY" onclick="switchOverviewBrand('OKIPAY')">
        <span class="brand-dot"></span>
        OKIPAY
      </button>
      <button type="button" id="btn-ov-both" class="unified-brand-btn" data-brand="BOTH" onclick="switchOverviewBrand('BOTH')">
        <span class="brand-dot" style="background: #8b5cf6;"></span>
        Keduanya
      </button>
    </div>
  </div>

  <!-- CONTAINER KONTEN DINAMIS -->
  <div id="overview-content">
    <div class="card" style="padding: 24px; text-align: center; color: var(--text-muted);">
      Memuat ringkasan data transaksi...
    </div>
  </div>

</div>
