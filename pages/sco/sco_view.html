<!-- TOP CONTROLS & ACTION STRIP -->
<div
  style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;">
  <div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <h2 style="font-size: 20px; font-weight: 700; letter-spacing: -0.4px; margin: 0;">Preview Dashboard SCO</h2>
    </div>
    <p style="font-size: 11px; color: var(--text-muted); margin-top: 3px; margin-bottom: 0;">
      Monitoring Performa Harian, Tren Penjualan, Detil Agen, &amp; KPI Insentif SCO
    </p>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
    <!-- Tombol Hitung Ulang Data -->
    <button type="button" id="btn-sco-generate" onclick="handleScoGenerate()" class="sco-action-btn sco-btn-secondary">
      <svg id="icon-sco-calc" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      <span id="label-sco-calc">Refresh (Parquet)</span>
    </button>

    <!-- Tombol Push ke GitHub -->
    <button type="button" id="btn-sco-push" onclick="handleScoPush()" class="sco-action-btn sco-btn-primary">
      <svg id="icon-sco-push" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
        <polyline points="16 6 12 2 8 6"></polyline>
        <line x1="12" y1="2" x2="12" y2="15"></line>
      </svg>
      <span id="label-sco-push">Push ke GitHub</span>
    </button>

    <!-- Tombol Download PNG Potret HD -->
    <button type="button" id="btn-sco-download" onclick="handleScoDownloadPng()"
      class="sco-action-btn sco-btn-secondary" title="Download rekap laporan potret jernih untuk kirim WhatsApp">
      <svg id="icon-sco-download" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16a34a"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      <span id="label-sco-download">Download PNG</span>
    </button>

    <!-- Buka Live Link -->
    <a href="https://depocell.github.io/SCO/" target="_blank" rel="noopener noreferrer"
      class="sco-action-btn sco-btn-secondary" title="Buka web live GitHub Pages">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      Open URL
    </a>

    <!-- Tab Terpisah -->
    <a href="/pages/sco/index.html" target="_blank" rel="noopener noreferrer" class="sco-action-btn sco-btn-secondary"
      title="Buka halaman SCO di tab baru">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="9" y1="3" x2="9" y2="21"></line>
      </svg>
      Preview Localhost
    </a>
  </div>
</div>

<style>
  .sco-action-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s ease;
    box-sizing: border-box;
    line-height: 1.4;
  }

  .sco-btn-primary {
    background: #0284c7;
    color: #ffffff !important;
    border: 1px solid #0284c7;
    box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
  }

  .sco-btn-primary:hover {
    background: #0369a1;
    border-color: #0369a1;
  }

  .sco-btn-secondary {
    background: var(--surface);
    color: var(--text-main) !important;
    border: 1px solid var(--surface-border);
  }

  .sco-btn-secondary:hover {
    background: var(--table-header);
    border-color: #cbd5e1;
  }

  @keyframes sco-spin {
    to { transform: rotate(360deg); }
  }
</style>

<!-- STATUS BANNER (Notifikasi jika ada push / sync) -->
<div id="sco-status-banner"
  style="display: none; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 14px;">
</div>

<!-- EMBEDDED IFRAME DASHBOARD SCO -->
<div
  style="background: var(--surface); border: 1px solid var(--surface-border); border-radius: 12px; overflow: hidden; box-shadow: var(--card-shadow);">
  <iframe id="sco-app-frame" src="/pages/sco/index.html"
    style="width: 100%; height: calc(100vh - 165px); min-height: 750px; border: none; display: block; background: transparent;"></iframe>
</div>
