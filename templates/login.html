<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login &bull; Depo Cell Web Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg-dark: #070b14;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --card-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: rgba(2, 132, 199, 0.15);
      --accent: #38bdf8;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-border: rgba(239, 68, 68, 0.3);
      --radius: 12px;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    /* Subtle geometric ambient background */
    body::before {
      content: '';
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.12) 0%, rgba(7, 11, 20, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.4);
      margin-bottom: 16px;
    }
    .brand-logo-badge svg {
      width: 28px;
      height: 28px;
      color: #ffffff;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
    }
    .card-heading {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 22px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.2s;
    }
    .form-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 14px 12px 42px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      background: #0f172a;
    }
    .form-input:focus + .input-icon {
      color: var(--accent);
    }
    .btn-toggle-pwd {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .btn-toggle-pwd:hover {
      color: var(--text-main);
    }
    .btn-toggle-pwd svg {
      width: 18px;
      height: 18px;
    }
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 0 24px 0;
      font-size: 13px;
    }
    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .remember-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }
    .btn-submit:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
    }
    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .btn-submit svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2;
    }
    .alert-banner {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 8px;
      padding: 11px 14px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #fca5a5;
    }
    .alert-banner svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      stroke-width: 2;
    }
    .card-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #475569;
    }
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1 class="brand-title">DEPO CELL</h1>
      <p class="brand-subtitle">Business Intelligence &amp; Analytics Platform</p>
    </div>

    <div class="login-card">
      <h2 class="card-heading">Autentikasi Manajemen</h2>
      <p class="card-desc">Masukkan kredensial akun untuk mengakses dashboard</p>

      <div id="alertBanner" class="alert-banner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="alertMessage">Username atau password tidak valid.</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="username" class="form-input" placeholder="Masukkan username" required autofocus autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="password" class="form-input" placeholder="Masukkan password" required autocomplete="current-password">
            <button type="button" class="btn-toggle-pwd" onclick="togglePasswordVisibility()" title="Tampilkan / Sembunyikan Password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="options-row">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Ingat saya selama 30 hari</span>
          </label>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">
          <span id="btnText">Masuk ke Dashboard</span>
          <div id="btnSpinner" class="spinner"></div>
          <svg id="btnArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>

    <div class="card-footer">
      Sistem Terproteksi &bull; Web Report Enterprise v2.4
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        pwd.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;

      const alertBox = document.getElementById('alertBanner');
      const alertMsg = document.getElementById('alertMessage');
      const btn = document.getElementById('btnSubmit');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('btnSpinner');
      const arrow = document.getElementById('btnArrow');

      alertBox.style.display = 'none';
      btn.disabled = true;
      btnText.textContent = 'Memverifikasi...';
      spinner.style.display = 'block';
      arrow.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p, remember_me: remember })
        });
        const data = await res.json();

        if (res.ok && data.ok) {
          btnText.textContent = 'Berhasil! Mengalihkan...';
          // Redirect ke halaman utama atau return_url jika ada
          const params = new URLSearchParams(window.location.search);
          const next = params.get('next') || '/';
          window.location.href = next;
        } else {
          alertMsg.textContent = data.error || 'Username atau password salah.';
          alertBox.style.display = 'flex';
          btn.disabled = false;
          btnText.textContent = 'Masuk ke Dashboard';
          spinner.style.display = 'none';
          arrow.style.display = 'block';
        }
      } catch (err) {
        alertMsg.textContent = 'Terjadi kesalahan jaringan atau server.';
        alertBox.style.display = 'flex';
        btn.disabled = false;
        btnText.textContent = 'Masuk ke Dashboard';
        spinner.style.display = 'none';
        arrow.style.display = 'block';
      }
    }
  </script>
</body>
</html>
